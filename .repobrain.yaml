# RepoBrain configuration (generated by `repobrain init`).
version: 1

embedding:
  # Graph-first (D18): RepoBrain's core is the deterministic tree-sitter graph + FTS, and the
  # AI agent supplies the query terms. Semantic vector search is OPT-IN — a secondary signal.
  # Leave disabled for a fast, tiny, fully-offline index (no model download, no re-embed).
  enabled: false
  # Used only when enabled. Local & offline after first download.
  model: onnx-community/Qwen3-Embedding-0.6B-ONNX

index:
  churn_window_days: 90
  max_file_size_kb: 512
  # Extra ignore globs (added to defaults + .gitignore + .repobrainignore).
  ignore: []

ranking:
  # Hybrid score weights (spec §9.3). Tune via `repobrain eval`.
  weights:
    w_lex: 0.25
    w_sem: 0.25
    w_graph: 0.25
    w_path: 0.10
    w_git: 0.075
    w_mem: 0.075
  pagerank:
    damping: 0.85
    max_iterations: 50

capsule:
  default_budget: 8000
  default_model: generic # claude | gpt | generic
  # Fractions of the token budget (spec §9.5).
  budget_distribution:
    architecture: 0.10
    code: 0.35
    skeletons: 0.25
    tests: 0.15
    memories: 0.10
    safety: 0.05
