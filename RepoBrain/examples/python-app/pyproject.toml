[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "example-python-app"
version = "0.1.0"
description = "A small example Python backend used as a RepoBrain golden test fixture."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
