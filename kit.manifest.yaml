# Разметка «наше / слить / его» для обновлялки кита (шаг 3, Б6 ТЗ).
# Вклеивается дословно в kit.manifest.yaml внутри архива. Только данные.
#
# ours_replaceable    — файлы кита, которые пользователь не редактирует → заменить молча.
# merge_required      — файлы кита, которые пользователь наполняет под себя → показать
#                       разницу и слить с согласия. CLAUDE.md здесь, а НЕ в ours_replaceable:
#                       иначе обновление затрёт заполненные пользователем {{...}}.
# theirs_never_touch  — всё, что создал пользователь → не трогать никогда.
update_policy:
  ours_replaceable:
    - ".claude/skills/**"
    - ".claude/hooks/**"
    - ".claude/updater/**"
    - ".claude/CLAUDE.md"
    - "INSTALL.md"
    - "START-HERE.md"
    - "GUIDE.md"
    - "TOUR.md"
    - "README.md"
    - "second-brain/00_system/**"
    - "RepoBrain/**"
    - "kit.manifest.yaml"
    - "kit.manifest.json"
  merge_required:
    - "CLAUDE.md"
    - "AGENTS.md"
    - ".claude/settings.json"
    - ".gitignore"
    - ".repobrainignore"
  theirs_never_touch:
    - "second-brain/01_projects/**"
    - "second-brain/02_architecture/**"
    - "second-brain/03_processes/**"
    - "second-brain/04_not-done/**"
    - "second-brain/05_history/**"
    - "second-brain/06_marketing/**"
    - "second-brain/13_glossary/**"
    - "second-brain/index.md"
    - "plans/**"
    - "docs/**"
    - "memory/**"
